local_costmap:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    local_costmap:
      # 独立的 odom 局部窗口；定位与静态 /map 不受扫描图更新影响。
      width: 4.0
      height: 4.0
      resolution: 0.05
      # 与全局图共用按 Waffle 碰撞几何取整的车体半径和 0.02 m 余量。
      observation_uncertainty: 0.03
      robot_radius: 0.24
      safety_margin: 0.02
      # 膨胀内切半径对齐 learning；跟踪器另收原始几何，车体安全半径仍为 0.26 m。
      inscribed_radius: 0.22549849949589046
      inflation_radius: 0.70
      cost_scaling_factor: 3.0
      # 对齐官方未知格接收规则；开启后未知格也作为完整膨胀源。
      inflate_around_unknown: false
      obstacle_max_range: 2.5
      raytrace_max_range: 3.0
      max_scan_age: 1.0
      observation_persistence: 2.0
      publish_frequency: 5.0
