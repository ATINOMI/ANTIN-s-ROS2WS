local_costmap:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    local_costmap:
      # 独立的 odom 局部窗口；定位与静态 /map 不受扫描图更新影响。
      width: 4.0
      height: 4.0
      resolution: 0.05
      # 与全局图共用按 Waffle 碰撞几何取整的车体半径和 0.05 m 余量。
      robot_radius: 0.24
      safety_margin: 0.05
      inflation_radius: 0.45
      cost_scaling_factor: 10.0
      # 未知格始终禁行；开启后只额外传播硬安全区。
      inflate_around_unknown: false
      obstacle_max_range: 2.5
      raytrace_max_range: 3.0
      max_scan_age: 1.0
      observation_persistence: 2.0
      publish_frequency: 5.0
