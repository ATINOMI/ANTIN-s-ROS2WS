costmap_publisher:
  ros__parameters:
    planning:
      # Gazebo Waffle SDF 最远碰撞角点 0.237 m，URDF 为 0.238 m；向上取 0.24 m。
      robot_radius: 0.24
      safety_margin: 0.02
      # 障碍、未知格与地图外侧都留 0.26 m 硬安全距离；
      # 只有确定障碍在 0.26 到 0.45 m 间生成衰减软代价。
      inflation_radius: 0.45
      cost_scaling_factor: 10.0
      # 未知格始终禁行；开启后只额外传播 0.26 m 硬安全区。
      inflate_around_unknown: false
      cost_travel_multiplier: 2.0
      # 原目标不可达时，在其栅格中心周围寻找最近可达安全点（米）；0 禁用。
      goal_tolerance: 0.5
      # 超过该秒数的机器人 TF 不可作为规划起点。
      max_pose_age: 1.0
