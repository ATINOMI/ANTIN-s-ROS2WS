# 官方 Nav2 Jazzy Costmap2DROS 的并列对照配置。
# 代价地图算法及图层由已安装的 nav2_costmap_2d 提供，本文件只设参数。
# 三张图复用 mini_nav 当前的 /map、/scan 和 TF，不启动第二份仿真或定位。
nav2_reference_global:
  costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.22
      footprint_padding: 0.01
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      map_topic: /map
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
        inflate_unknown: false
        inflate_around_unknown: false

# 与自研规划图使用相同的静态地图、硬安全半径和软膨胀参数。
# 这张图不叠加扫描障碍，用来单独观察官方与自研膨胀算法的差别。
nav2_reference_matched:
  costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.26
      footprint_padding: 0.0
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      map_topic: /map
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.45
        inflate_unknown: false
        inflate_around_unknown: false

nav2_reference_local:
  costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      footprint_padding: 0.01
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
        inflate_unknown: false
        inflate_around_unknown: false
